<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraCoder</title>
    <!-- 旧 favicon 路径保留备查；对应资源已不存在。
    <link rel="icon" type="image/png" href="/src/assets/brand/auracoder-app-icon.png" />
    -->
    <link rel="icon" type="image/png" href="/src/assets/brand/auracoder-logo.png" />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0f10;
        transition: opacity 180ms ease-out;
      }
      :root[data-theme="light"] #app-splash {
        background: #ffffff;
      }
      /* 旧版内联 SVG 尺寸规则保留备查。
      #app-splash svg {
        width: 96px;
        height: 96px;
      }
      */
      #app-splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #app-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash.hidden {
        display: none;
      }
    </style>
    <script>
      (function () {
        // Blocking paint hint: stamp data-theme before first paint so returning
        // users never see a flash of the wrong theme while the async config
        // load (main.tsx) resolves the real, authoritative preference.
        try {
          var pref = localStorage.getItem("auracoder:theme-preference");
          var mode =
            pref === "light" || pref === "dark"
              ? pref
              : pref === "system"
                ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                    ? "light"
                    : "dark")
                : "dark";
          document.documentElement.dataset.theme = mode;
          // var displayScale = localStorage.getItem("auracoder:display-scale");
          // if (["100", "110", "120", "130", "140", "150"].includes(displayScale)) {
          //   document.documentElement.style.setProperty("zoom", displayScale + "%");
          // }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
 <body>
   <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <!-- 旧版内联启动标记保留备查；启动画面当前使用统一图片资源。
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="8" width="48" height="48" rx="12" stroke="#F3F3F5" stroke-width="4"/>
        <path d="M26 10V54M28 27H54" stroke="#F3F3F5" stroke-width="4" stroke-linecap="round"/>
        <rect x="34" y="34" width="14" height="14" rx="5" fill="#61D596"/>
      </svg>
      -->
      <img src="/src/assets/brand/auracoder-logo.png" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
