appenders:
  stderr:
    kind: console
    target: stderr
    filters:
      - kind: threshold
        level: info
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S%.3f)} [{l}] {t} - {m}{n}"
  file:
    kind: rolling_file
    path: logs/auracoder.log
    filters:
      - kind: threshold
        level: debug
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S%.3f)} [{l}] {t} - {m}{n}"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 5 mb
      roller:
        kind: fixed_window
        pattern: logs/auracoder.{}.log
        base: 1
        count: 100
root:
  level: debug
  appenders:
    - stderr
    - file
